<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#ffffff"><title>Deine Schadenaufnahme · UNFALLX</title><link rel="stylesheet" href="/assets/customer-handoff.css"><script src="/assets/customer-handoff.js" type="module"></script></head><body><main><header><img src="/assets/customer-logo.png" alt="UNFALLX" id="brand"><span>KUNDENAUFNAHME</span></header><div id="content" aria-live="polite"><h1>Deine Aufnahme.</h1><p>Der sichere Zugang wird geprüft …</p></div><p id="error" role="alert" hidden></p><footer><a href="/portal-datenschutz" target="_blank" rel="noopener noreferrer">Datenschutz</a><a href="/impressum" target="_blank" rel="noopener noreferrer">Impressum</a></footer></main><dialog id="sign-dialog"><form method="dialog"><button class="close" aria-label="Schließen">×</button></form><h2 id="sign-title"></h2><p>Lies zuerst alle Seiten. Du unterschreibst jeden Auftrag separat.</p><a id="pdf-link" target="_blank" rel="noopener" class="secondary">PDF groß öffnen / speichern</a><div id="document" role="region" aria-label="Alle Seiten des Auftrags" tabindex="0"></div><div id="sign-controls"><label>Ort der Unterschrift<input id="sign-place" maxlength="120" autocomplete="address-level2"></label><label class="check"><input type="checkbox" id="read">Ich habe alle Seiten dieses Auftrags einschließlich beigefügter Bedingungen gelesen.</label><label class="check"><input type="checkbox" id="agree">Ich stimme diesem Auftrag zu und möchte ihn mit meiner Unterschrift erteilen.</label><p>Mit dem Finger im Feld unterschreiben:</p><canvas id="signature" width="1000" height="450" aria-label="Unterschrift mit Finger oder Maus zeichnen"></canvas><button id="clear" class="secondary" type="button">Unterschrift löschen</button><button id="sign-submit" type="button">Diesen Auftrag verbindli
